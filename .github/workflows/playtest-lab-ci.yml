name: Playtest Lab CI

on:
  push:
    branches:
      - playtest-lab-v0.2
  pull_request:
    branches:
      - playtest-lab-v0.2
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: playtest-lab

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore verified rules engine
        working-directory: .
        run: bash playtest-lab/bootstrap.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playtest-lab/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: TypeScript check
        run: npm run check

      - name: Automated tests
        run: npm test

      - name: Deterministic synthetic smoke
        run: npm run smoke:synthetic
